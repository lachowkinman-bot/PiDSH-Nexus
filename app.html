<html lang="zh-CN" data-theme="ocean" data-density="comfortable">
<head>

<style>
/* theme.css — 设计令牌（设计 v2 §6）
   密度与主题全部走 CSS 变量；[data-density] 与 [data-theme] 挂在 <html> 上，切换零重排。 */
:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --font-base: 15px; --line: 1.6;
  --content-max: 1440px; --drawer-w: 420px; --row-h: 44px; --radius: 10px;
  --sidebar-w: 248px; --topbar-h: 52px;
  --bg: #f7f8fa; --panel: #ffffff; --line-c: #e5e7eb; --text: #1f2937; --muted: #6b7280; --head: #111827;
  --p: #2563eb; --p-weak: #eff6ff; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #0891b2;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .18);
}
html[data-theme="emerald"] { --p: #059669; --p-weak: #ecfdf5; }
html[data-theme="violet"] { --p: #7c3aed; --p-weak: #f5f3ff; }
html[data-density="compact"] { --font-base: 13px; --row-h: 34px; --space-4: 12px; --space-5: 16px; --space-6: 20px; }

* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body { font: var(--font-base)/var(--line) system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); }
a { color: var(--p); text-decoration: none; }
button { font: inherit; }

/* —— 布局：两级侧边栏 + 主区 —— */
.layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100%; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line-c); overflow: auto; display: flex; flex-direction: column; }
.brand { padding: var(--space-4); font-weight: 700; color: var(--head); border-bottom: 1px solid var(--line-c); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.nav { padding: var(--space-2) 0 var(--space-6); }
.nav-item, .nav-sub { display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left; padding: var(--space-2) var(--space-4); border: 0; background: none; color: var(--text); cursor: pointer; }
.nav-item:hover, .nav-sub:hover { background: var(--bg); }
.nav-item.active { background: var(--p-weak); color: var(--p); font-weight: 600; }
.nav-sub { padding-left: var(--space-6); font-size: .95em; color: var(--muted); }
.nav-sub.active { color: var(--p); font-weight: 600; background: var(--p-weak); }
.nav-sub.kind-w::before { content: "▸"; opacity: .5; }
.nav-sub.kind-t::before { content: "▤"; opacity: .5; }
.nav-group { border-top: 1px solid var(--line-c); margin-top: var(--space-2); padding-top: var(--space-2); }
.nav-sec { padding: var(--space-2) var(--space-4); font-size: .8em; color: var(--muted); letter-spacing: .04em; }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar { height: var(--topbar-h); display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-5); background: var(--panel); border-bottom: 1px solid var(--line-c); position: sticky; top: 0; z-index: 3; }
.crumb { color: var(--muted); }
.crumb b { color: var(--head); }
.spacer { flex: 1; }
.content { overflow: auto; padding: var(--space-5); }
.wrap { max-width: var(--content-max); margin: 0 auto; }

/* —— 组件 —— */
.card { background: var(--panel); border: 1px solid var(--line-c); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-4); margin-bottom: var(--space-4); }
.card > h3 { margin: 0 0 var(--space-3); font-size: 1.05em; color: var(--head); }
.grid { display: grid; gap: var(--space-4); }
.grid.k4 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.k2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.kpi .v { font-size: 1.7em; font-weight: 700; color: var(--head); }
.kpi .l { color: var(--muted); font-size: .9em; }
.btn { border: 1px solid var(--line-c); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--p); color: var(--p); }
.btn.p { background: var(--p); border-color: var(--p); color: #fff; }
.btn.p:hover { filter: brightness(1.06); color: #fff; }
.btn.sm { padding: 3px 8px; font-size: .9em; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .82em; background: var(--bg); border: 1px solid var(--line-c); color: var(--muted); }
.tag.ok { background: #ecfdf5; color: var(--ok); border-color: #a7f3d0; }
.tag.warn { background: #fffbeb; color: var(--warn); border-color: #fde68a; }
.tag.bad { background: #fef2f2; color: var(--bad); border-color: #fecaca; }
.tag.p { background: var(--p-weak); color: var(--p); border-color: #bfdbfe; }
.muted { color: var(--muted); }
.toolbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
input, select, textarea { font: inherit; border: 1px solid var(--line-c); border-radius: 8px; padding: 6px 10px; background: #fff; color: var(--text); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--p-weak); border-color: var(--p); }
.field { display: grid; grid-template-columns: 132px 1fr; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.field .err { grid-column: 2; color: var(--bad); font-size: .88em; }

/* 表格：表头 sticky，行高令牌化 */
.tbl-wrap { overflow: auto; border: 1px solid var(--line-c); border-radius: var(--radius); background: var(--panel); }
table.tbl { width: 100%; border-collapse: collapse; }
table.tbl th, table.tbl td { padding: var(--space-2) var(--space-3); text-align: left; border-bottom: 1px solid var(--line-c); white-space: nowrap; height: var(--row-h); }
table.tbl thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; font-weight: 600; color: var(--head); border-bottom: 1px solid var(--line-c); }
table.tbl tbody tr { cursor: pointer; }
table.tbl tbody tr:nth-child(even) { background: #fcfcfd; }
table.tbl tbody tr:hover { background: var(--p-weak); }
.pager { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); }

/* 步骤条：流程页 */
.steps { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.step { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border: 1px solid var(--line-c); border-radius: 999px; background: var(--panel); }
.step .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .82em; background: var(--bg); color: var(--muted); }
.step.done { border-color: #a7f3d0; background: #ecfdf5; }
.step.done .n { background: var(--ok); color: #fff; }
.step.cur { border-color: var(--p); background: var(--p-weak); }
.step.cur .n { background: var(--p); color: #fff; }
.step-arrow { color: var(--muted); }

/* 抽屉 */
.scrim { position: fixed; inset: 0; background: rgba(16, 24, 40, .28); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: var(--drawer-w); background: var(--panel); box-shadow: var(--shadow-lg); z-index: 41; display: flex; flex-direction: column; }
.drawer header { padding: var(--space-4); border-bottom: 1px solid var(--line-c); display: flex; align-items: center; gap: var(--space-2); }
.drawer .body { padding: var(--space-4); overflow: auto; }
.drawer footer { margin-top: auto; padding: var(--space-4); border-top: 1px solid var(--line-c); display: flex; gap: var(--space-2); }
dl.kv { display: grid; grid-template-columns: 140px 1fr; gap: var(--space-2) var(--space-3); margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; word-break: break-all; }
.audit { font-family: ui-monospace, Consolas, monospace; font-size: .88em; }
.empty { padding: var(--space-6); text-align: center; color: var(--muted); }

</style>
</head>

包）CFO","**是**（`dual:true`）","acceptance 原文\"超包 10% 加签 CFO\"：`","delta_wan","> budget_wan × 10%` 必须 CFO 加签","n3 approval（L4 + `dual:true`，hitl_nodes=[n3]）"],["月度财报（fin.monthly-report）","取数 → 汇总 → 写产物 → 审计","无审批（分级出数）","否","分级别口径：公司级汇总可对 L4 输出；部门明细仅在 L4 命名空间内","无 approval 节点（kind=report）"],["付款/现金流（fin.cashflow-week）","取数 → 汇总 → 写产物 → 审计","无审批（只出汇总）","否","银行账户字段一律不得出现在产物中（只出 in/out/balance 汇总）","无 approval 节点（kind=report）"]]}],"bullets":["场景基线 `policies.permission.min_level=L4`、`dual_approval=false` 为**域默认**；两条 approve 工作流在流程级升格为 L4 双审批（与 workflow YAML 一致），规则**单调加严、不放松**。","审批级别（`expenses.level`）判定规则（本文档细化，manifest 未写死数值）：**取\"科目基准级别\"与\"金额升级规则\"二者较高者**——基准：办公费/交通费=L1，差旅费/员工活动费=L2，设备采购/云资源费/外包服务费/房租物业费/招聘服务费/审计咨询费/银行手续费=L3，市场推广费/广告投放费/项目直接成本=L4；金额升级：≥5 万元不低于 L3，≥30 万元为 L4。","5 万元 / 30 万元 / 50 万元为本文档细化阈值；定制时必须与 scene/workflow 配置保持同一口径并只允许加严。"]}],"source":"docs/preset-design/fin.md#§5"},"9":{"title":"校验规则","blocks":[{"heading":"(本节)","tables":[{"header":["规则","判定","失败处理"],"rows":[["V-FIN-01 发票要素完整性","`invoice_no` / `invoice_code` / `invoice_date` / `seller_name` / `seller_taxid` / `buyer_title` / `buyer_taxid` / `amount_yuan` 非空；`invoice_code` 为 12 位数字；税号 18 位（本表 1 条 17 位为**故意注入样例**）","FAIL：要素缺失或格式非法不得入账；税号位数异常转人工复核"],["V-FIN-02 价税恒等与三流一致","逐行 `amount_yuan + tax_yuan = total_yuan`；且 `total_yuan = expenses.amount_yuan`（同 `expense_id`）","FAIL：金额不符行不得置已批准（样例 EXP-8823）"],["V-FIN-03 连号检测","同销方 + 同发票代码 + 号码连续 → **直接 FAIL**（workflow acceptance 原文）","FAIL：禁止自动放行，退回报销单并记疑点（样例 INV-2026-090107/090108）"],["V-FIN-04 抬头与主体一致性","`buyer_title` = `星桥科技（上海）有限公司` 且 `buyer_taxid` = `91310115MA1K3QX09T`","FAIL：抬头不一致一票否决（样例 EXP-8813）"],["V-FIN-05 金额阈值与审批级别","`level` = max(科目基准级别, 金额升级规则)（§5）；金额 ≥5 万元须 `approvals ≥2`；≥30 万元必须 L4；≥50 万元加签 CFO","FAIL：级别低于规则或双审批人数不足，不得置已批准"],["V-FIN-06 预算余额不足拦截","在途报销单 `amount_yuan > remain_wan × 10000` → 拦截（不许透支）；`remain_wan \u003c 0` 即负余额为非法","FAIL：立即阻断并转 `fin.budget-review`（样例 EXP-8824，行政部剩余 4.00 万元）"],["V-FIN-07 四表勾稽","`Σexpenses.amount_yuan(部门,期间)/10000 = budget.used_wan`；`Σrevenue_ledger.amount_yuan(部门,期间)/10000 = budget.revenue_wan`；`budget_wan − used_wan = remain_wan`；`net_wan = revenue_wan − used_wan`；全表等式在 2026-08 / 2026-09 两期均成立","FAIL：任一等式不成立即拒绝出数，先修数据再出报告"],["V-FIN-08 外键与发票归档完整性","`invoices.expense_id` ∈ `expenses.expense_id`（禁孤儿行）；`expenses.invoice_no` 未在 invoices.csv 命中时，必须在报告中列为\"发票未归档/待补件\"（本快照 29 张凭证中 19 张已归档、10 张待补件）","FAIL：孤儿行拒绝写入；未归档项漏报视为报告不合格"],["V-FIN-09 财报数字 A 级可溯","`monthly-report` 四必填字段每个值必须给出 (文件, 行, 列) 证据；成本与收入须同时给出汇总层与凭证层两个来源且相互吻合","FAIL：无证据链或仅单一来源 → 判定 B 级并显式声明缺口，不得标注 A 级"],["V-FIN-10 脱敏与边界","`bank_account` 禁入任何输出（只出汇总）；`invoice_taxid` 出域前必过 `redact_gate`（只出合规结论/掩码）；`applicant_masked` 不得还原","FAIL：任一违规即一票否决（redact_gate 未命中即出域）"],["V-FIN-11 状态迁移合法","`expenses.status` ∈ {待预审, 待审批, 双审批中, 已批准, 已驳回, 已报销}；`invoices.check_result` ∈ {通过, 疑点, FAIL}；迁移只经唯一函数并写操作日志","FAIL：非法枚举值拒绝写入；跳级迁移回退并记审计"]]}],"bullets":[]}],"source":"docs/preset-design/fin.md#§9"}},"gaps":[]},"mkt-off":{"$schema":"domain-model/v1","domain":"mkt-off","label":"营销（线下）MKT-OFF","scene_ids":["mkt-off.event-roi@1.0.0"],"level":"L3","dual_approval":false,"redact_fields":["dealer_terms"],"memory":{"pii_allowed":false,"exclude":[]},"generated_at":"2026-09-30T05:10:13.577Z","sources":{"scenes":["manifests/scenes/mkt-off.event-roi.yaml"],"workflows":"manifests/workflows/index.json","data":"templates/workspace/data/mkt-off/","doc":"docs/preset-design/mkt-off.md"},"tables":[{"file":"dealer_agreements.csv","rows":12,"columns":["dealer_id","dealer_masked","region","tier","agreement_no","terms_digest","rebate_pct","exclusive_flag","sellthrough_pct","dispute_flag","period","owner","updated_at"],"pii_likely":["dealer_masked"]},{"file":"events.csv","rows":16,"columns":["event","budget_wan","actual_wan","roi","city","owner","event_id","quarter","event_type","venue","start_date","end_date","venue_cost_wan","attendees","leads","leads_dedup","revenue_wan","dept_quarter_pkg_wan","status"],"pii_likely":[]},{"file":"materials.csv","rows":14,"columns":["materia te`、`attendees`、`leads` 必填；`leads_dedup ≤ leads`"],["已结束 → 复盘完成","ROI 复盘出数并归档","`event-roi-\u003cts>.json`：budget_wan / actual_wan / roi / lessons，逐行可追溯到 events.csv"]]}],"bullets":[]},{"heading":"4.2 物料合规（MATERIAL_STATUS，materials.review_status）","tables":[{"header":["状态（CSV 落值）","标识符","进入条件","允许后继","证据字段"],"rows":[["待审","pending_review","物料新建/返修重提；法务、品牌均未受理","审核中","`legal_check=未审` 且 `brand_check=未审`；`reviewer_*` 与 `reviewed_at` 为 `-`"],["审核中","in_review","至少一项已受理（法务项与品牌项分别流转，子状态由 `legal_check`/`brand_check` 承载）","通过 / 驳回","`legal_check` 或 `brand_check` ∈ {通过, 待改}；`reviewed_at` 为最近一次审查完成日"],["通过","approved","`legal_check=通过` 且 `brand_check=通过`","—（终态）","`external_ready=yes`；进入外发清单（仍须走 `material-review` 审批，§5）"],["驳回","rejected","任一项不过","待审（返修升版重提）","`issue_type` 必填（如 `文案绝对化用语` / `品牌字号不合规` / `价格比较表述无依据` / `证言授权待补`）"]]}],"bullets":["子状态口径：`legal_check` / `brand_check` ∈ {未审, 待改, 通过}；`待改` 与存量值 `字号不合规`（M-2604）等价，均不得置 `通过`。","**可外发不变量**：`external_ready = yes ⟺ review_status=通过 ∧ legal_check=通过 ∧ brand_check=通过`（§9 V-MKTOFF-04）；本快照可外发 6 行（M-2601/2603/2605/2607/2611/2612），未过 8 行（M-2602/2604/2606/2608/2609/2610/2613/2614）。","本快照分布（14 行）：通过 6 / 审核中 4 / 待审 2 / 驳回 2；驳回样例 M-2604（现场背板，`brand_check=字号不合规`）与 M-2610（经销商返利政策单页，法务 `待改`：价格比较表述无依据）。"]},{"heading":"4.3 场地/展位签约（BOOTH_STATUS，`mkt-off.booth-approve`）","tables":[{"header":["状态","判定","证据字段"],"rows":[["待审批","场地/展位报价已确认，审批未发起","events：venue / venue_cost_wan / start_date+end_date / status=待审批"],["双审批中","签约金额 >30 万元（§5 阈值），`approvals` 计数 1/2","`booth-approve-\u003cts>.json`：cost_wan / approver"],["已签约","双人（或阈值内单人）签批完成","approver 非空；events.status 迁移至执行中"],["已驳回","审批驳回或预算超包未解决","驳回原因必填；不得产生不可逆支出（押金/定金同样受控）"]]}],"bullets":[]}],"source":"docs/preset-design/mkt-off.md#§4"},"5":{"title":"审批链（节点-角色-双审批-金额阈值）","blocks":[{"heading":"(本节)","tables":[{"header":["流程","节点链","审批角色","双审批","金额/条件阈值","manifest 落点"],"rows":[["物料外发（mkt-off.material-review）","物料审查 → 条件判定 → L4 审批 → 写产物 → 审计","法务负责人 → 品牌负责人（对外投放物料两级均须签字）","**是**（`dual: true`，无免审例外）","域基线：所有 `external_ready=yes` 的物料外发均须双审批；任一合规项未过 → 一票否决（不得外发）","n3 approval（L4 + `dual:true`，hitl_nodes=[n3]）"],["场地/展位签约（mkt-off.booth-approve）","策划案 → 条件判定 → L4 审批 → 写产物 → 审计","部门负责人 + 法务/财务 BP →（大额）分管副总","**是**（`dual:true` 恒定；阈值决定是否加签）","acceptance 原文\"单场签约 >30 万双审批\"：`venue_cost_wan > 30` 必须双人签批并加签分管副总；`≤30` 为双审基础档（本快照边界样例 EV-2614 = 30 万元，另一侧命中 7 行，最大 EV-2602 = 56 万元）","n3 approval（L4 + `dual:true`，hitl_nodes=[n3]）"],["活动 ROI 复盘（mkt-off.event-roi）","取数 → 复盘 → 写产物 → 审计","无审批（报告类，分级出数）","否","数字须逐行可追溯；不得外推或倒轧","无 approval 节点（kind=report）"],["活动策划（mkt-off.event-plan）","取数 → 计算 → 写产物 → 审计","无审批节点；**预算超包时由产物携带审批链**","否（产物携带，不等同审批节点）","`budget_wan > dept_quarter_pkg_wan × 20%` → 产物必须给出审批链与资金来源（本快照 12 行命中，如 EV-2608：110 > 400 × 20% = 80）","无 approval 节点（kind=calc）"],["经销商简报（mkt-off.vendor-brief）","取数 → 汇总 → 写产物 → 审计","无审批（对外前由 CMP 侧留痕，§6）","否","`dealer_terms` 原文不出域，只出摘要与掩码","无 approval 节点（kind=report）"],["线索移交（mkt-off.lead-handoff）","取数 → 去重 → 写产物 → 审计","无审批（`redact_gate` 为硬闸门）","否","移交前必须过 `redact_gate`；`leads_dedup` 不得为 0 时误报为有效线索（0 不得移交）","无 approval 节点（kind=calc）"]]}],"bullets":["场景基线 `policies.permission.min_level=L3`、`dual_approval=false` 为**域默认**；两条 approve 工作流在流程级升格为 L4 双审批（与 workflow YAML 一致），规则**单调加严、不放松**。","30 万元与\"季度包 20%\"为本文档细化的可检查阈值；定制时必须与 scene/workflow 配置保持同一口径并只允许加严。"]}],"source":"docs/preset-design/mkt-off.md#§5"},"9":{"title":"校验规则","blocks":[{"heading":"(本节)","tables":[{"header":["规则","判定","失败处理"],"rows":[["V-MKTOFF-01 主键与必填","events：`event_id`/`event`/`budget_wan`/`actual_wan`/`roi`/`city`/`owner`/`quarter`/`status` 非空且 `event_id` 唯一；materials：`material_id`/`material`/`review_status`/`legal_check`/`brand_check`/`owner`/`event_id` 非空且 `material_id` 唯一；dealer_agreements：`dealer_id`/`dealer_masked` 非空且唯一","缺失或重复即拒写，提示\"请填写必填项\"/\"已存在\""],["V-MKTOFF-02 引用完整性","`materials.event_id ∈ events.event_id`（禁孤儿行；本快照 14 行全部命中 EV-2601~EV-2616 中的活动）；`events.owner` 须落在词表内（存量值 `筹备中` 为登记例外）","外键校验失败即拒写；孤儿物料不得进入任何报告"],["V-MKTOFF-03 **预算超部门季度包 20% 触发审批**（workflow acceptance 原文口径，两条同时生效、取严）","①单场口径：`budget_wan > dept_quarter_pkg_wan × 20%` → 立项须触发审批，产物携带审批链与资金来源（本快照 12 行命中，命中样例 EV-2608：110 > 80）；②季度累计口径：`Σ budget_wan(owner, quarter) > dept_quarter_pkg_wan × 1.2` → 超包 ≥20%，转 `fin.budget-review` 并冻结新增非必要活动（本快照命中 渠道部 317/200 = 158.5%、市场部 510/400 = 127.5%）；③超包 10%~20% 为预警（品牌组 165/150 = 110%），\u003c100% 为正常（行政支持 65/80 = 81.3%）","未触发却产生不可逆支出 = 流程违例（回滚 + 审计）；触发而未在产物列出审批链 = 交付不合格"],["V-MKTOFF-04 **任一合规项未过不得外发**","`external_ready=yes` 当且仅当 `review_status=通过 ∧ legal_check=通过 ∧ brand_check=通过`；未过行（本快照 8 行）不得出现在任何外发清单/投放排期；外发必经 `material-review` L4 双审批","违规外发 = **一票否决**，回滚至 `pre-material-review` 并记审计"],["V-MKTOFF-05 **ROI 数字可追溯**","已结算行 `roi = revenue_wan ÷ actual_wan`（2 位小数四舍五入）；`actual_wan=0` 时 `roi=0` 且 `revenue_wan=0`；报告中每个 ROI/收入/线索数字必须给出 (文件, 行, 列) 证据","无证据链或倒轧 = 交付不合格；数字不得外推或用常识补数"],["V-MKTOFF-06 金额与超支","`budget_wan/actual_wan/venue_cost_wan/revenue_wan ≥ 0`；`actual_wan > budget_wan` 的超支行（本快照 5 行，最大 112.0%）须在报告中标注；超支 ≥20% 转审批","负值拒写；超支未标注 = 报告不合格"],["V-MKTOFF-07 **经销商条款 L3 脱敏**","`dealer_terms` 原文不落地；出域/入报告只允许 `dealer_masked`（`DEALER-***##`）与 `terms_digest` 摘要；出域前必过 `redact_gate`；`vendor-brief` 的 `risk` 必须覆盖 `dispute_flag=是` 的全部行（本快照 2 家）","命中未脱敏 = 一票否决（redact_gate 未命中即出域）；经销商真名/条款原文泄露 = 安全事件"],["V-MKTOFF-08 日期与结算一致性","`end_date ≥ start_date`；`start_date` 可晚于数据基线日（跨季举办），但 `quarter` 恒等于预算归属季度；`status ∈ {执行中, 策划中, 待审批}` 时 `leads=0`、`revenue_wan=0`、`roi=0`（未结算不得预估）；`leads_dedup ≤ leads`","违反即拒写；预估数入账 = 交付不合格"],["V-MKTOFF-09 枚举与阈值白名单","`status ∈ {策划中, 待审批, 执行中, 已结束, 复盘完成}`；`review_status ∈ {待审, 审核中, 通过, 驳回}`；`legal_check/brand_check ∈ {未审, 待改, 通过}`（存量 `字号不合规` 为登记例外）；`external_ready ∈ {yes, no}`；`sellthrough_pct \u003c 60` 触发滞销提示；`dispute_flag=是` 必入 `risk`","非法枚举值拒绝写入；跳级迁移回退并记审计"],["V-MKTOFF-10 场地签约阈值","`venue_cost_wan > 30` 的行必须给出双审批记录（approver 双人）；`≤30` 不得误报为双审批档（边界样例 EV-2614 = 30 万元）","阈值错判或双审批缺失 = 不得置\"已签约\""],["V-MKTOFF-11 脱敏与记忆边界","events/materials 无 PII 出域；materials 审查人只出掩码名；`pii_allowed=false` —— 经销商条款与标识禁入记忆层与公网检索","违规即一票否决；已入记忆层须按策略清除并留痕"],["V-MKTOFF-12 交付验收","三条 GT 产物落 `reports/mkt-off/gt-*.md`（附 JSON 交付物）；审计为读/算/写三段事件；approve 类工作流须记\"审批人 + 依据数据版本 + 产物哈希\"","缺审计或缺审批记录 = 交付不合格"]]}],"bullets":[]}],"source":"docs/preset-design/mkt-off.md#§9"}},"gaps":[]},"mkt-on":{"$schema":"domain-model/v1","domain":"mkt-on","label":"营销（线上）MKT-ON","scene_ids":["mkt-on.content-publish@1.0.0"],"level":"L4","dual_approval":false,"redact_fields":["lead_phone","lead_idcard"],"memory":{"pii_allowed":false,"exclude":[]},"generated_at":"2026-09-30T05:10:13.580Z","sources":{"scenes":["manifests/scenes/mkt-on.content-publish.yaml"],"workflows":"manifests/workflows/index.json","data":"templates/workspace/data/mkt-on/","doc":"docs/preset-design/mkt-on.md"},"tables":[{"file":"ad_spend.csv","rows":12,"columns":["channel","week","spend_wan","approved_budget_wan","impressions","clicks","owner"],"pii_likely":[]},{"file":"content_calendar.csv","rows":15,"columns":["date","channel","title","status","owner","content_id","content_type","publish_time","pii_check"],"pii_likely":[]},{"file":"leads.csv","rows":20,"columns":["lead_id","source","stage","score","contact_masked","channel","created_at","est_value_wan","owner_masked","note"],"pii_likely":["contact_masked"]}],"skills":[{"name":"content-gen","file":"templates/skills-domain/mkt-on/SKILL-content-gen.md"},{"name":"ad-analysis","file":"templates/skills-domain/mkt-on/SKILL-ad-analysis.md"},{"name":"seo-audit","file":"templates/skills-domain/mkt-on/SKILL-seo-audit.md"}],"workflows":[{"id":"mkt-on.publish-approve@1.0.0","kind":"approve","description":"内容发布审批（L4 强审批 + 脱敏）","skill":"content-gen","approval":{"node":"n3","level":"L4","dual":true},"hitl_nodes":["n3"],"nodes":[{"id":"n1","type":"skill","ref":"content-gen"},{"id":"n2","type":"condition","expr":"内容发布审批（L4 强审批 + 脱敏） 触发对外/生效动作"},{"id":"n3","type":"approval","level":"L4","dual":true},{"id":"n4","type":"tool","ref":"cap.excel.panel.write"},{"id":"n5","type":"audit","record":"内容发布审批（L4 强审批 + 脱敏）：审批人 + 依据数据版本 + 产物哈希"}],"delivera % 加签 CFO」；样例 QT-3305（15%）、QT-3306（18%）、QT-3308（16%）、QT-3312（22%）"],["合同会签","合同评审触发（回款条款偏离标准）","sales.contract-review n3（**L4，dual=true**，hitl_nodes=[n3]）","法务负责人 → 财务负责人","2","acceptance 原文「回款条款偏离标准必须双审批」；样例 QT-3310（合同 HT-2026-0427）"]]}],"bullets":["钉死事实：两条 approve 工作流的 n3 均为 `level: L4`、`dual: true`（取自工作流 YAML/index.json）；`approval_route` 三档与「≥10% 双审批 / ≥15% 加签 CFO」为 acceptance 原文口径，角色映射为落地建议（scene/工作流未钉角色，按 ROLES/caps 配置）。","路由判定取**较严者**：折扣档与底价规则同时命中时按高档执行（如 QT-3301 折扣 8% 落一级授权档，但低于底价 → 双审批）。","驳回/回滚：驳回 → 流程 rejected，报价回落 `草稿` 并必填原因；rollback savepoint `pre-quote-approve` / `pre-contract-review`；审批意见（通过/驳回原因）写入 audit n5。","审批路由 → 交付字段映射：`approval_route` = 一级授权/双审批/双审批+CFO加签 → workflow `approvals` 签数 1/2/3；`status` 为 待审批 时按已签数计（1/2/3 中未完成态）。"]}],"source":"docs/preset-design/sales.md#§5"},"9":{"title":"校验规则","blocks":[{"heading":"(本节)","tables":[{"header":["规则","判定","失败处理"],"rows":[["V-SALES-01 必填与枚举","pipeline：opportunity_id / stage / amount_k / owner / region / probability_pct / close_month / customer_id 非空；quotes：quote_id / discount_pct / total_wan / status / opportunity_id / customer_id / list_price_wan / discount_floor_wan / approval_route / payment_terms / terms_deviation 非空；targets：region / region_quota_wan / owner_masked / owner_target_wan / quarter 非空；枚举白名单（阶段 §4.1、报价状态 §4.2、大区、来源、路由、条款偏离）","缺失或越界即拒写，提示「请填写必填项/枚举非法」"],["V-SALES-02 主键与外键","opportunity_id、quote_id 唯一；`quotes.opportunity_id ∈ pipeline.opportunity_id`（禁孤儿行）；`quotes.customer_id ≡ 该商机 customer_id`（防串户）；`targets.region ⊆ pipeline.region` 且 `targets.owner_masked ⊆ pipeline.owner`","外键/一致性失败即拒写；孤儿报价不得进入审批"],["V-SALES-03 折扣阈值与加签","`approval_route = 双审批+CFO加签`（discount ≥15）＞ `双审批`（10 ≤ discount \u003c15，或低于底价）＞ `一级授权`（discount \u003c10 且 ≥底价），取较严者；`status ∈ {已批准, 已审批, 已发出}` 的行必须与阈值一致（≥10% 不得为一级授权；≥15% 必须含 CFO 加签）","档位低于规则或路由与折扣不符即 FAIL，不得置已批准/已发出"],["V-SALES-04 低于底价必须转审批","逐行判定 `total_wan \u003c discount_floor_wan`：命中行 `approval_route ∈ {双审批, 双审批+CFO加签}`；草稿命中时提交必须进入 `sales.quote-approve`（不得直接发送）","低于底价 （总表）","blocks":[{"heading":"(本节)","tables":[{"header":["文件","级别","PII 字段","行数","说明"],"rows":[["courses.csv","L2","—","18","课程库 + 培训计划台账（排期/名额/学时/预算/审批人）。scene 声明名 `courses.xlsx`（Excel 面板语义），落地为同名 CSV；`scripts/data-consistency-check.mjs` 按 basename 归一化匹配"],["certificates.csv","L3","cert_id","14","岗位技能认证与证书台账（有效期/状态/换证费用/岗位依赖）。scene 声明名 `certificates.xlsx`；`cert_id` 以 `CERT-****-NNNN` 假名化存储，输出侧仍强制过 `redact_gate`"]]}],"bullets":["**行数** = 数据行数（不含表头），两张表均 ≥10 行，满足数据字典规格与 `data-consistency-check` 的下限校验。","**级别**：`courses.csv` L2（可外发口径，无 PII）；`certificates.csv` L3（含 PII 字段 `cert_id`，且 `holder_masked`/`approver`/`renew_date` 组合可反查个人，按 L3 管控）。","**外键**：`certificates.course` → `courses.course`（逐字命中，见 §9 规则 R7）；`courses.prereq` → `courses.course`（自引用）。","本域落地数据根为 `templates/workspace/data/trn/`；GT 八元组中的 `data/trn/courses.xlsx` 指同一逻辑表的 scene 声明名。"]},{"heading":"§1.1 字段级数据字典","tables":[{"header":["字段名","类型","必填","说明"],"rows":[["course","string","是","课程名（业务主键；被 `certificates.course` 与 `prereq` 引用）"],["hours","number","是","计划学时（整数，1–24）"],["enrolled","number","是","已报名人数（校验 `enrolled ≤ seat_cap`）"],["next_session","string","是","场次日期 `MM-DD`（数据基线年 2026；`已结束` 行填已结束场次日期）"],["category","enum","是","课程分类：必修 / 进阶 / 领导力 / 合规 / 技能（对齐 PRD F2 的 入职/管理/业务/合规/技能 维度）"],["dept","string","是","追加列·主办部门（`trn.hours-report` 的部门口径来源）"],["trainer","string","是","追加列·讲师（脱敏工号 `T1***`–`T9***`，外部讲师 `EXT-***A`–`EXT-***D`）"],["room","string","是","追加列·场地（教室号 / `线上直播` / `实训基地` / `外部场地`；与 trainer+日期共同做冲突检测）"],["seat_cap","number","是","追加列·名额上限（报名确认的上限依据，见 §9 R4）"],["prereq","string","是","追加列·前置课（课程名；无前置填 `无`）"],["pass_rate","number","否","追加列·最近一期通过率 %（保留 1 位小数）；`已结束` 行必填，`进行中/报名中` 行留空"],["completed_h","number","是","追加列·已完成学时（`报名中`=0；`进行中` 0\u003ccompleted_h\u003chours；`已结束`=hours）"],["status","enum","是","追加列·计划/课程状态：报名中 / 进行中 / 已结束（= TRAIN_STATUS，见 §4.1）"],["budget_wan","number","是","追加列·预算（万元）；外部采购课程 >0 即触发 `trn.plan-approve` 审批"],["approver","string","否","追加列·预算审批人（脱敏工号 `A1***`/`A2***`）；留空 = 未提审或审批在途"]]},{"header":["字段名","类型","必填","说明"],"rows":[["certificate","string","是","证书/资质名（如 特种作业操作证、安全员B证）"],["holder_masked","string","是","持证人（脱敏工号 `E1***`–`E12***`；禁存姓名/身份证）"],["issue_date","date","是","首次发证日 `YYYY-MM-DD`"],["expire_date","date","是","有效期至 `YYYY-MM-DD`（`已续期` 行 = 续期后新效期）"],["status","enum","是","证书状态：有效 / 90天内到期 / 已过期 / 已续期（见 §4.2）"],["cert_id","string","是","追加列·证书编号（假名化 `CERT-****-NNNN`，**PII**，`redact_gate` 强制脱敏后方可出产物）"],["holder_dept","string","是","追加列·持证人部门（到期拦截按部门聚合的唯一口径）"],["course","string","是","追加列·对应培训课程（`→ courses.course`，用于\"先培训后发证/换证\"闭环）"],["required_role","string","是","追加列·岗位强依赖（如 特种作业岗/叉车司机岗；**排班拦截**的匹配键）"],["renew_fee","number","否","追加列·换证/复审费用（元）；`已续期`=实际发生，`90天内到期`=预估，其余留空"],["approver","string","否","追加列·换证审批人（脱敏工号）；仅已提审/已续期行非空"],["renew_date","date","否","追加列·最近一次复审/换证生效日（`已续期` 行非空）"]]}],"bullets":[]}],"source":"docs/preset-design/trn.md#§1"},"4":{"title":"状态机","blocks":[{"heading":"4.1 培训计划/课程状态（TRAIN_STATUS，参照 §3.3）","tables":[{"header":["状态","枚举值","进入条件","允许迁移","本域样例行"],"rows":[["报名中","`signup`","计划已建、场次未开（`next_session` 晚于数据基线日），`completed_h=0`，`pass_rate` 空","→ 进行中（到达开课日）；→ 已结束（取消并归档，须留审计）","新员工入职、合规与信息安全、销售进阶谈判、管理者 First 30 天、数据安全与隐私保护、项目管理实战、客户服务与投诉处理（7 行）"],["进行中","`ongoing`","已到开课日，`0 \u003c completed_h \u003c hours`","→ 已结束（结课 + 成绩录入，`completed_h=hours` 且 `pass_rate` 非空）","特种作业安全操作、焊接与热切割作业、危化品安全管理、安全员 B 证考前培训、安全员 C 证考前培训（5 行）"],["已结束","`done`","结课，`completed_h = hours` 且 `pass_rate` 已录","终态；如需复盘另起新计划行（不复用行）","电动叉车安全操作、高处作业安全操作、一级建造师继续教育、注册安全工程师继续教育、注册会计师继续教育、消防安全与应急处置（6 行）"]]}],"bullets":[]},{"heading":"4.2 证书状态（certificates.status）","tables":[{"header":["状态","判定式","迁移","本域样例行（days_left）"],"rows":[["有效","`days_left > 90`","→ 90天内到期（随日历推进自动降级，无需人工动作）","注册会计师(244)、一级建造师(537)、注册安全工程师(923)、低压电工作业证(586)、起重机械指挥证(134)、消防设施操作员证(1086)、一级注册消防工程师(774)"],["90天内到期","`0 \u003c days_left ≤ 90`","→ 已过期（到期未换证）；→ 已续期（`trn.cert-renew` 审批通过并顺延 `expire_date`）","特种作业操作证(15)、安全员B证(62)、危化品安全作业证(82)"],["已过期","`days_left ≤ 0` 且未换证","**不可自动复位**；须走 `trn.cert-renew` 双审批 <script>
/* app.js — 独立单页工作台（设计 v2：D1 独立应用 / D5 两级侧栏+驾驶舱 / D6 真实读写+持久化）
   数据与页面清单全部来自 window.__DOMAIN_MODELS__（manifests/domain-model/*.json，由 gen-domain-model.mjs 生成）。 */
(() => {
  const MODELS = window.__DOMAIN_MODELS__;
  const SEED = window.__DATA__;
  const ORDER = window.__DOMAIN_ORDER__;
  const DELIVERY = window.__DELIVERY__ || { domains: {}, formats: [] };
  const $ = (s, r) => (r || document).querySelector(s);

  // ———— hyperscript ————
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
    return el;
  }

  async function api(path, options) {
    const r = await fetch(path, Object.assign({ headers: { 'content-type': 'application/json' } }, options || {}));
    const text = await r.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch { body = { error: text }; }
    if (!r.ok) throw new Error((body && (body.error || body.message)) || `HTTP ${r.status}`);
    return body;
  }

  function openArtifact(file) {
    const url = '/workbench/api/artifact?id=' + encodeURIComponent(file);
    const a = h('a', { href: url, download: file.split('/').pop() || 'artifact' });
    document.body.append(a);
    a.click();
    a.remove();
  }

  function deliveryCenter(domain) {
    const status = h('div', { class: 'muted' }, '读取交付记录…');
    const list = h('div');
    let busy = false;
    let targetDomain = domain || ORDER[0];
    const run = async (formats) => {
      if (busy) return;
      busy = true;
      status.textContent = `正在生成 ${MODELS[targetDomain].label} 交付包…`;
      try {
        const r = await api('/workbench/api/deliver', {
          method: 'POST',
          body: JSON.stringify({ domain: targetDomain, formats: formats || undefined }),
        });
        status.textContent = `已完成 ${r.artifacts.length} 个文件：${r.manifestPath}`;
        audit('delivery.ui', { domain: targetDomain, formats: formats || 'all', runId: r.runId });
        await refresh();
      } catch (e) {
        status.textContent = '生成失败：' + e.message;
      } finally {
        busy = false;
      }
    };
    const formatButton = (label, formats) => h('button', {
      class: 'btn sm' + (formats ? '' : ' p'),
      onclick: () => run(formats),
    }, label);
    let refresh = async () => {
      try {
        const rows = await api('/workbench/api/artifacts' + (domain ? `?domain=${encodeURIComponent(domain)}` : ''));
        if (!rows.length) {
          list.replaceChildren(h('div', { class: 'empty' }, domain ? '本域尚无交付包，点击上方按钮生成。' : '尚无交付包。'));
          return;
        }
        list.replaceChildren(...rows.slice(0, 5).map((item) => h('div', { style: 'padding:10px 0;border-bottom:1px solid var(--line-c)' },
          h('div', null, h('b', null, item.title || item.domain), ' ', h('span', { class: 'tag p' }, item.domain), ' ', h('span', { class: 'tag ok' }, `${item.artifactCount} 文件`)),
          h('div', { class: 'muted', style: 'font-size:.86em' }, item.generatedAt + ' · ' + item.path),
          h('div', { class: 'toolbar', style: 'margin-top:6px' }, ...(item.artifacts || []).map((artifact) => h('button', {
            class: 'btn sm',
            onclick: () => openArtifact(artifact.file),
          }, artifact.format.toUpperCase()))))));
      } catch (e) {
        list.replaceChildren(h('div', { class: 'err' }, '交付记录不可用：' + e.message));
      }
    };
    queueMicrotask(refresh);
    return card(domain ? `${MODELS[domain].label} · 交付中心` : '跨域交付中心',
      status,
      h('div', { class: 'toolbar', style: 'margin-top:10px' },
        domain ? null : h('select', { class: 'btn sm', onchange: (e) => { targetDomain = e.target.value; refresh(); } },
          ...ORDER.map((d) => h('option', { value: d }, MODELS[d].label))),
        formatButton('生成全部格式'),
        ...['MD', 'CSV', 'HTML', 'XLSX', 'DOCX', 'PPTX', 'PDF'].map((label) => formatButton(label, label.toLowerCase()))),
      h('div', { style: 'margin-top:8px' }, list));
  }

  // ———— 持久化（D6：localStorage，前缀 hr_workbench_）————
  const K_DATA = (d) => 'hr_workbench_data_' + d, K_AUDIT = 'hr_workbench_audit', K_UI = 'hr_workbench_ui', K_FLOW = 'hr_workbench_flows';
  const read = (k, dflt) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; } catch { return dflt; } };
  const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const dataOf = (d) => read(K_DATA(d), null) || SEED[d] || {};
  const saveData = (d, v) => write(K_DATA(d), v);
  const flows = () => read(K_FLOW, {});
  const saveFlows = (v) => write(K_FLOW, v);
  function audit(action, detail) { const a = read(K_AUDIT, []); a.unshift(Object.assign({ ts: new Date().toISOString(), action }, detail)); write(K_AUDIT, a.slice(0, 800)); }
  const ui = () => read(K_UI, { theme: 'ocean', density: 'comfortable' });
  const setUI = (patch) => { write(K_UI, Object.assign(ui(), patch)); applyUI(); };

  function applyUI() {
    const u = ui();
    document.documentElement.dataset.theme = u.theme;
    document.documentElement.dataset.density = u.density;
  }

  // ———— 路由 ————
  function parse() {
    const raw = location.hash.replace(/^#\/?/, '');
    if (!raw) return { name: 'dash' };
    const p = raw.split('/');
    if (p[0] === 'audit') return { name: 'audit' };
    if (p[0] === 'deliverables') return { name: 'delivs' };
    const dom = p[0];
    if (!MODELS[dom]) return { name: 'dash' };
    if (!p[1]) return { name: 'overview', dom };
    if (p[1] === 'settings') return { name: 'settings', dom };
    if (p[1] === 't') return { name: 'table', dom, table: p[2] };
    if (p[1] === 'w') return { name: 'workflow', dom, wf: p[2] };
    return { name: 'overview', dom };
  }
  const go = (hash) => { location.hash = hash; };

  // ———— 侧边栏（D5：两级）————
  function sidebar(r) {
    const items = [];
    items.push(h('button', { class: 'nav-item' + (r.name === 'dash' ? ' active' : ''), onclick: () => go('#/') }, '◲ 主驾驶舱'));
    for (const d of ORDER) {
      const m = MODELS[d];
      const active = r.dom === d;
      items.push(h('button', { class: 'nav-item' + (active ? ' active' : ''), onclick: () => go('#/' + d) },
        h('span', null, m.label), h('span', { class: 'spacer' }), h('span', { class: 'tag' }, String(m.pages.length))));
      if (active) {
        items.push(h('button', { class: 'nav-sub' + (r.name === 'overview' ? ' active' : ''), onclick: () => go('#/' + d) }, '域概览'));
        for (const t of m.tables) items.push(h('button', {
          class: 'nav-sub kind-t' + (r.name === 'table' && r.table === t.file.replace(/\.csv$/, '') ? ' active' : ''),
          onclick: () => go(`#/${d}/t/${t.file.replace(/\.csv$/, '')}`),
        }, t.file.replace(/\.csv$/, '')));
        for (const w of m.workflows) items.push(h('button', {
          class: 'nav-sub kind-w' + (r.name === 'workflow' && r.wf === w.id.split('@')[0].split('.')[1] ? ' active' : ''),
          onclick: () => go(`#/${d}/w/${w.id.split('@')[0].split('.')[1]}`),
        }, w.description.length > 14 ? w.description.slice(0, 14) + '…' : w.description));
        items.push(h('button', { class: 'nav-sub' + (r.name === 'settings' ? ' active' : ''), onclick: () => go(`#/${d}/settings`) }, '域设置'));
      }
    }
    items.push(h('div', { class: 'nav-group' }, h('div', { class: 'nav-sec' }, '全过程'),
      h('button', { class: 'nav-item' + (r.name === 'audit' ? ' active' : ''), onclick: () => go('#/audit') }, '审计事件流'),
      h('button', { class: 'nav-item' + (r.name === 'delivs' ? ' active' : ''), onclick: () => go('#/deliverables') }, '交付物')));
    return h('aside', { class: 'sidebar' }, h('div', { class: 'brand' }, 'PiDSH Nexus · 全能工作台'), h('nav', { class: 'nav' }, items));
  }

  // ———— 顶栏 ————
  const DENS = { comfortable: '舒适', compact: '紧凑' };
  const THEMES = { ocean: '海洋', emerald: '翡翠', violet: '紫罗兰' };
  function topbar(r, crumb) {
    const u = ui();
    return h('header', { class: 'topbar' },
      h('div', { class: 'crumb' }, crumb),
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn sm', title: '返回 DSH 主壳：聊天会话 / 插件市场 / 技能中心 / 记忆系统', onclick: () => { location.href = '/'; } }, '⟵ 主壳 · 会话/插件/技能'),
      h('button', { class: 'btn sm', onclick: () => go('#/') }, '主驾驶舱'),
      h('button', { class: 'btn sm', title: '密度', onclick: () => setUI({ density: u.density === 'comfortable' ? 'compact' : 'comfortable' }) }, '密度：' + DENS[u.density]),
      h('select', { class: 'btn sm', onchange: (e) => setUI({ theme: e.target.value }) },
        ...Object.entries(THEMES).map(([k, v]) => h('option', { value: k, selected: u.theme === k }, v))),
      h('button', { class: 'btn sm', onclick: () => { if (confirm('重置全部本地数据（数据/审计/流程）？')) { ORDER.forEach((d) => localStorage.removeItem(K_DATA(d))); localStorage.removeItem(K_AUDIT); localStorage.removeItem(K_FLOW); render(); } } }, '重置数据'));
  }

  // ———— 通用块 ————
  const kpi = (label, value) => h('div', { class: 'card kpi' }, h('div', { class: 'v' }, String(value)), h('div', { class: 'l' }, label));
  const card = (title, ...body) => h('section', { class: 'card' }, title ? h('h3', null, title) : null, ...body);

  function modelTable(block) {   // 渲染域模型里的「带出处的表格」（状态机/审批链/校验规则）
    if (!block) return h('div', { class: 'muted' }, '（无结构化内容）');
    return h('div', null,
      block.blocks.map((b) => h('div', { style: 'margin-bottom:12px' },
        h('div', { class: 'muted', style: 'margin-bottom:6px' }, b.heading),
        ...b.tables.map((t) => h('div', { class: 'tbl-wrap', style: 'margin-bottom:8px' },
          h('table', { class: 'tbl' }, h('thead', null, h('tr', null, ...t.header.map((c) => h('th', null, c)))),
            h('tbody', null, ...t.rows.map((row) => h('tr', null, ...row.map((c) => h('td', null, c)))))))),
        ...b.bullets.map((x) => h('div', { class: 'muted', style: 'margin:4px 0' }, '· ' + x)))),
      h('div', { class: 'muted', style: 'font-size:.85em' }, '出处：' + block.source));
  }

  // ———— 抽屉 ————
  function drawer(title, bodyNodes, footNodes) {
    const close = () => { $('.scrim')?.remove(); $('.drawer')?.remove(); };
    document.body.append(
      h('div', { class: 'scrim', onclick: close }),
      h('aside', { class: 'drawer' }, h('header', null, h('b', null, title), h('span', { class: 'spacer' }), h('button', { class: 'btn sm', onclick: close }, '关闭')),
        h('div', { class: 'body' }, ...bodyNodes), h('footer', null, ...(footNodes || []))));
  }

  // ———— 页：驾驶舱 ————
  function pageDash() {
    const tot = ORDER.reduce((s, d) => s + MODELS[d].tables.reduce((x, t) => x + t.rows, 0), 0);
    const wf = ORDER.reduce((s, d) => s + MODELS[d].workflows.length, 0);
    const gt = ORDER.reduce((s, d) => s + MODELS[d].golden_tasks.length, 0);
    const fl = flows(); const running = Object.values(fl).filter((x) => x.status === 'running').length;
    return h('div', { class: 'wrap' },
      h('h1', { style: 'font-size:24px;margin:0 0 4px;color:var(--head)' }, '主驾驶舱'),
      h('div', { class: 'muted', style: 'margin-bottom:16px' }, '跨域 KPI、业务域入口与交付状态总览'),
      h('div', { class: 'grid k4' }, kpi('业务域', ORDER.length), kpi('数据表 / 行数', `${ORDER.reduce((s, d) => s + MODELS[d].tables.length, 0)} / ${tot}`), kpi('工作流', wf), kpi('Golden Tasks', gt)),
      h('div', { class: 'grid k4' }, kpi('在途流程', running), kpi('审计事件', read(K_AUDIT, []).length), kpi('页面', ORDER.reduce((s, d) => s + MODELS[d].pages.length, 0) + 3), kpi('交付物', '见交付物页')),
      card('业务域', h('div', { class: 'grid k2' }, ...ORDER.map((d) => {
        const m = MODELS[d];
        return h('div', { class: 'card', style: 'margin:0;cursor:pointer', onclick: () => go('#/' + d) },
          h('h3', null, m.label),
          h('div', { class: 'muted' }, m.tables.map((t) => t.file.replace(/\.csv$/, '')).join(' ｜ ')),
          h('div', { style: 'margin-top:8px' }, h('span', { class: 'tag p' }, m.level || '-'), ' ', h('span', { class: 'tag' }, m.dual_approval ? '双审批' : '单审批'), ' ', h('span', { class: 'tag' }, m.workflows.length + ' 流程'), ' ', h('span', { class: 'tag' }, m.golden_tasks.length + ' GT')));
      }))),
      deliveryCenter(null));
  }

  // ———— 页：域概览 ————
  function pageOverview(d) {
    const m = MODELS[d], data = dataOf(d);
    const delivery = DELIVERY.domains[d] || {};
    const rows = m.tables.reduce((s, t) => s + ((data[t.file] || []).length || t.rows), 0);
    return h('div', { class: 'wrap' },
      h('div', { class: 'grid k4' },
        kpi('数据表', m.tables.length), kpi('行数', rows), kpi('工作流', m.workflows.length), kpi('Golden Tasks', m.golden_tasks.length)),
      card('交付规范', h('div', null,
        h('h3', null, delivery.title || `${m.label} 交付包`),
        h('div', { class: 'muted' }, '代表工作流：' + (delivery.workflow_id || '-')),
        h('div', { style: 'margin-top:8px' }, ...(DELIVERY.formats || []).map((f) => h('span', { class: 'tag p', style: 'margin-right:4px' }, f.toUpperCase()))))),
      card('域策略', h('div', null,
        h('span', { class: 'tag p' }, '级别 ' + (m.level || '-')), ' ',
        h('span', { class: 'tag' }, m.dual_approval ? '双审批' : '单审批'), ' ',
        ...(m.redact_fields || []).map((f) => h('span', { class: 'tag warn', style: 'margin-left:4px' }, '脱敏 ' + f)),
        m.memory ? h('div', { class: 'muted', style: 'margin-top:8px' }, '记忆层：' + JSON.stringify(m.memory)) : null)),
      h('div', { class: 'grid k2' },
        card('状态机（§4）', modelTable(m.sections['4'])),
        card('审批链（§5）', modelTable(m.sections['5']))),
      card('数据资产', h('div', { class: 'grid k2' }, ...m.tables.map((t) => h('div', { class: 'card', style: 'margin:0' },
        h('h3', null, t.file), h('div', { class: 'muted' }, t.columns.length + ' 列 ｜ ' + ((data[t.file] || []).length || t.rows) + ' 行'),
        t.pii_likely.length ? h('div', { style: 'margin-top:6px' }, ...t.pii_likely.map((c) => h('span', { class: 'tag warn', style: 'margin-right:4px' }, c))) : null,
        h('div', { style: 'margin-top:8px' }, h('button', { class: 'btn sm', onclick: () => go(`#/${d}/t/${t.file.replace(/\.csv$/, '')}`) }, '打开台账')))))),
      card('Golden Tasks', h('div', null, ...m.golden_tasks.map((g) => h('div', { style: 'padding:6px 0;border-bottom:1px solid var(--line-c)' },
        h('b', null, g.id), ' ', h('span', { class: 'muted' }, g.input), g.expected_output ? h('div', { class: 'muted', style: 'font-size:.88em' }, '产物：' + g.expected_output) : null)))),
      card('校验规则（§9）', modelTable(m.sections['9'])),
      deliveryCenter(d));
  }

  // ———— 页：台账（每表一页）————
  const PAGE = 15;
  function pageTable(d, fileStem) {
    const m = MODELS[d];
    const tb = m.tables.find((t) => t.file.replace(/\.csv$/, '') === fileStem);
    if (!tb) return h('div', { class: 'wrap' }, h('div', { class: 'empty' }, '未找到该表'));
    const file = tb.file;
    const box = h('div', { class: 'wrap' });
    let page = 1, q = '';
    const draw = () => {
      const data = dataOf(d);
      const all = data[file] || [];
      const header = (data.__header && data.__header[file]) || tb.columns;
      const idx = header.map((c, i) => [c, i]);
      const rows = q ? all.filter((r) => r.join(' ').toLowerCase().includes(q.toLowerCase())) : all;
      const pages = Math.max(1, Math.ceil(rows.length / PAGE));
      if (page > pages) page = pages;
      const slice = rows.slice((page - 1) * PAGE, page * PAGE);
      box.replaceChildren(
        h('div', { class: 'toolbar' },
          h('input', { placeholder: '搜索（跨列）', value: q, oninput: (e) => { q = e.target.value; page = 1; draw(); }, style: 'width:260px' }),
          h('span', { class: 'tag' }, rows.length + ' 行'),
          h('div', { class: 'spacer' }),
          h('button', { class: 'btn sm p', onclick: () => editRow(null) }, '新增'),
          h('button', { class: 'btn sm', onclick: () => exportCsv(file, header, all) }, '导出 CSV')),
        h('div', { class: 'tbl-wrap' }, rows.length ? h('table', { class: 'tbl' },
          h('thead', null, h('tr', null, ...header.map((c) => h('th', null, c)))),
          h('tbody', null, ...slice.map((r, i) => h('tr', { onclick: () => detail((page - 1) * PAGE + i) },
            ...idx.map(([, ci]) => h('td', null, r[ci] == null ? '' : String(r[ci])))))))
          : h('div', { class: 'empty' }, '暂无数据，点击「新增」录入')),
        h('div', { class: 'pager' },
          h('button', { class: 'btn sm', disabled: page <= 1, onclick: () => { page--; draw(); } }, '上一页'),
          h('span', { class: 'muted' }, `第 ${page} / ${pages} 页`),
          h('button', { class: 'btn sm', disabled: page >= pages, onclick: () => { page++; draw(); } }, '下一页')),
        h('div', { class: 'muted', style: 'margin-top:12px' }, '本表校验规则见「域设置」页 §9。'));
    };
    const detail = (i) => {
      const data = dataOf(d); const all = data[file] || [];
      const header = (data.__header && data.__header[file]) || tb.columns;
      const r = all[i];
      drawer(file + ' · 行 ' + (i + 1),
        [h('dl', { class: 'kv' }, ...header.flatMap((c, ci) => [h('dt', null, c), h('dd', null, r[ci] == null ? '—' : String(r[ci]))]))],
        [h('button', { class: 'btn p', onclick: () => editRow(i) }, '编辑'),
         h('button', { class: 'btn', onclick: () => { if (confirm('删除该行？')) { all.splice(i, 1); data[file] = all; saveData(d, data); audit('table.delete', { domain: d, table: file, row: i }); $('.drawer')?.remove(); $('.scrim')?.remove(); draw(); } } }, '删除')]);
    };
    const editRow = (i) => {
      const data = dataOf(d);
      data.__header = data.__header || {};
      if (!data.__header[file]) data.__header[file] = tb.columns.slice();
      const header = data.__header[file];
      const all = data[file] || [];
      const cur = i == null ? header.map(() => '') : all[i].slice();
      const inputs = header.map((c, ci) => h('div', { class: 'field' }, h('label', null, c),
        h('input', { value: cur[ci] == null ? '' : String(cur[ci]), oninput: (e) => { cur[ci] = e.target.value; }, 'data-ci': String(ci) })));
      const errBox = h('div', { class: 'err' });
      drawer((i == null ? '新增 · ' : '编辑 · ') + file, [...inputs, errBox], [
        h('button', {
          class: 'btn p', onclick: () => {
            // 通用校验：必填非空、金额/数量类必须为数字且 > 0（域级规则见 §9）
            const errs = [];
            header.forEach((c, ci) => { if (String(cur[ci]).trim() === '') errs.push(`「${c}」不能为空`); });
            header.forEach((c, ci) => { if (/amount|price|budget|used|remain|revenue|net|cost|total|qty|count|hours|days|_wan|_yuan|pct|score|rate/i.test(c) && String(cur[ci]).trim() !== '' && !/^-?\d+(\.\d+)?%?$/.test(String(cur[ci]).trim())) errs.push(`「${c}」应为数值`); });
            if (errs.length) { errBox.textContent = errs.join('；'); return; }
            if (i == null) { all.push(cur); audit('table.create', { domain: d, table: file }); }
            else { all[i] = cur; audit('table.update', { domain: d, table: file, row: i }); }
            data[file] = all; saveData(d, data);
            $('.drawer')?.remove(); $('.scrim')?.remove(); draw();
          }
        }, '保存'), h('button', { class: 'btn', onclick: () => { $('.drawer')?.remove(); $('.scrim')?.remove(); } }, '取消')]);
    };
    const exportCsv = (f, header, all) => {
      const txt = [header, ...all].map((r) => r.map((c) => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const a = h('a', { href: URL.createObjectURL(new Blob([txt], { type: 'text/csv' })), download: f });
      document.body.append(a); a.click(); a.remove();
      audit('table.export', { domain: d, table: f, rows: all.length });
    };
    draw();
    return box;
  }

  // ———— 页：流程（每流程一页）————
  const NLABEL = { skill: '技能', condition: '条件', approval: '审批(HITL)', tool: '工具', audit: '审计' };
  function pageWorkflow(d, stem) {
    const m = MODELS[d];
    const w = m.workflows.find((x) => x.id.split('@')[0].split('.')[1] === stem);
    if (!w) return h('div', { class: 'wrap' }, h('div', { class: 'empty' }, '未找到该工作流'));
    const box = h('div', { class: 'wrap' });
    const draw = () => {
      const fl = flows(); const inst = fl[w.id] || { step: w.nodes.length, status: 'not_started', log: [] };
      const curStep = inst.status === 'running' ? inst.step : (inst.status === 'done' ? w.nodes.length + 1 : 0);
      const steps = h('div', { class: 'steps' }, ...w.nodes.flatMap((n, i) => {
        const state = i + 1 < curStep ? 'done' : (i + 1 === curStep ? 'cur' : '');
        const el = h('div', { class: 'step ' + state }, h('span', { class: 'n' }, i + 1),
          h('span', null, n.id + ' ' + (NLABEL[n.type] || n.type) + (n.ref ? ' · ' + n.ref : '') + (n.dual ? ' · 双审批' : '')));
        return i < w.nodes.length - 1 ? [el, h('span', { class: 'step-arrow' }, '→')] : [el];
      }));
      const statusTag = { not_started: h('span', { class: 'tag' }, '未发起'), running: h('span', { class: 'tag p' }, '进行中 · 第 ' + inst.step + ' 步'), done: h('span', { class: 'tag ok' }, '已完成'), rejected: h('span', { class: 'tag bad' }, '已驳回'), cancelled: h('span', { class: 'tag' }, '已取消') }[inst.status];
      const rejectReason = h('input', { placeholder: '驳回原因（必填）', style: 'width:280px' });
      const act = [];
      if (inst.status === 'not_started' || !fl[w.id]) act.push(h('button', { class: 'btn p', onclick: () => { fl[w.id] = { step: 2, status: 'running', log: [{ ts: new Date().toISOString(), msg: '发起' }] }; saveFlows(fl); audit('flow.start', { domain: d, workflow: w.id }); draw(); } }, '发起流程'));
      if (inst.status === 'running') {
        act.push(h('button', { class: 'btn p', onclick: () => { inst.step++; if (inst.step > w.nodes.length) { inst.status = 'done'; } inst.log.push({ ts: new Date().toISOString(), msg: '推进 → 第 ' + inst.step + ' 步' }); fl[w.id] = inst; saveFlows(fl); audit('flow.advance', { domain: d, workflow: w.id, step: inst.step, status: inst.status }); draw(); } }, '通过 / 推进'));
        act.push(rejectReason, h('button', { class: 'btn', onclick: () => { if (!rejectReason.value.trim()) { alert('驳回必须填写原因'); return; } inst.status = 'rejected'; inst.log.push({ ts: new Date().toISOString(), msg: '驳回：' + rejectReason.value }); fl[w.id] = inst; saveFlows(fl); audit('flow.reject', { domain: d, workflow: w.id, reason: rejectReason.value }); draw(); } }, '驳回'));
        act.push(h('button', { class: 'btn', onclick: () => { inst.status = 'cancelled'; fl[w.id] = inst; saveFlows(fl); audit('flow.cancel', { domain: d, workflow: w.id }); draw(); } }, '取消'));
      }
      box.replaceChildren(
        h('div', { class: 'card' }, h('h3', null, w.description + '  '), statusTag,
          h('div', { style: 'margin:12px 0' }, steps),
          h('div', { class: 'toolbar' }, ...act),
          h('div', { class: 'muted' }, '工作流 ' + w.id + ' ｜ kind=' + w.kind + ' ｜ 技能 ' + w.skill + (w.approval ? ` ｜ 审批节点 ${w.approval.node} (${w.approval.level}${w.approval.dual ? ' + 双审批' : ''})` : ' ｜ 无审批节点'))),
        h('div', { class: 'grid k2' },
          card('交付规范', h('dl', { class: 'kv' },
            h('dt', null, '产物文件'), h('dd', null, w.deliverable.file),
            h('dt', null, '格式'), h('dd', null, w.deliverable.format),
            h('dt', null, '必填字段'), h('dd', null, w.deliverable.fields.join('、')),
            h('dt', null, '验收标准'), h('dd', null, w.deliverable.acceptance))),
          card('实例日志', inst.log && inst.log.length
            ? h('div', { class: 'audit' }, ...inst.log.slice().reverse().map((l) => h('div', null, l.ts + '  ' + l.msg)))
            : h('div', { class: 'muted' }, '尚未发起'))),
        card('节点链（来自 index.json，未合成）', h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
          h('thead', null, h('tr', null, h('th', null, '节点'), h('th', null, '类型'), h('th', null, '引用'), h('th', null, '说明'))),
          h('tbody', null, ...w.nodes.map((n) => h('tr', null, h('td', null, n.id), h('td', null, NLABEL[n.type] || n.type),
            h('td', null, n.ref || '—'), h('td', null, n.record || n.expr || (n.dual ? 'dual=true' : '') || '—')))))))
      );
    };
    draw();
    return box;
  }

  // ———— 页：域设置 ————
  function pageSettings(d) {
    const m = MODELS[d];
    const data = dataOf(d);
    return h('div', { class: 'wrap' },
      card('权限与策略', h('dl', { class: 'kv' },
        h('dt', null, '最低数据级别'), h('dd', null, m.level || '—'),
        h('dt', null, '双审批'), h('dd', null, m.dual_approval ? '是' : '否'),
        h('dt', null, '脱敏字段（redact_gate）'), h('dd', null, (m.redact_fields || []).join('、') || '—'),
        h('dt', null, '记忆层'), h('dd', null, JSON.stringify(m.memory || {})))),
      card('技能', h('div', null, ...m.skills.map((s) => h('div', { style: 'padding:4px 0' }, h('b', null, s.name), ' ', h('span', { class: 'muted' }, s.file || '（技能文件缺失）'))))),
      card('数据管理', h('div', { class: 'toolbar' },
        h('button', { class: 'btn', onclick: () => { if (confirm('重置本域数据为种子？')) { localStorage.removeItem(K_DATA(d)); audit('domain.reset', { domain: d }); render(); } } }, '重置本域数据'),
        h('button', { class: 'btn', onclick: () => { const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(dataOf(d), null, 1)], { type: 'application/json' })), download: d + '.json' }); document.body.append(a); a.click(); a.remove(); audit('domain.export', { domain: d }); } }, '导出本域 JSON'))),
      card('校验规则（§9，域定义原文）', modelTable(m.sections['9'])));
  }

  // ———— 页：审计 / 交付物 ————
  function pageAudit() {
    const a = read(K_AUDIT, []);
    return h('div', { class: 'wrap' }, card('审计事件流（本地 append-only，近 800 条）',
      a.length ? h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, h('th', null, '时间'), h('th', null, '动作'), h('th', null, '明细'))),
        h('tbody', null, ...a.slice(0, 300).map((e) => h('tr', null, h('td', null, e.ts), h('td', null, e.action), h('td', { class: 'audit' }, JSON.stringify(Object.assign({}, e, { ts: undefined, action: undefined }))))))))
        : h('div', { class: 'empty' }, '暂无审计事件；在台账或流程页操作后会在此留痕')));
  }
  function pageDelivs() {
    const rows = [];
    for (const d of ORDER) for (const w of MODELS[d].workflows) {
      rows.push(h('tr', null,
        h('td', null, MODELS[d].label), h('td', null, w.id), h('td', null, w.deliverable.file),
        h('td', null, w.deliverable.fields.join('、')), h('td', null, w.deliverable.acceptance)));
    }
    const table = h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, h('th', null, '域'), h('th', null, '工作流'), h('th', null, '产物'), h('th', null, '必填字段'), h('th', null, '验收标准'))),
      h('tbody', null, ...rows));
    return h('div', { class: 'wrap' },
      card('本域交付规范一览（来自 78 条工作流）', h('div', { class: 'tbl-wrap' }, table)),
      deliveryCenter(null));
  }

  // ———— 渲染 ————
  function render() {
    const r = parse();
    let page, crumb;
    if (r.name === 'dash') { page = pageDash(); crumb = h('span', null, '主驾驶舱'); }
    else if (r.name === 'audit') { page = pageAudit(); crumb = h('span', null, '审计事件流'); }
    else if (r.name === 'delivs') { page = pageDelivs(); crumb = h('span', null, '交付物'); }
    else {
      const m = MODELS[r.dom];
      const tail = { overview: '域概览', table: r.table, workflow: r.wf, settings: '域设置' }[r.name];
      crumb = h('span', null, m.label, ' / ', h('b', null, tail || ''));
      page = r.name === 'overview' ? pageOverview(r.dom)
        : r.name === 'table' ? pageTable(r.dom, r.table)
          : r.name === 'workflow' ? pageWorkflow(r.dom, r.wf)
            : pageSettings(r.dom);
    }
    $('#app').replaceChildren(h('div', { class: 'layout' }, sidebar(r), h('main', { class: 'main' }, topbar(r, crumb), h('div', { class: 'content' }, page))));
  }

  applyUI();
  window.addEventListener('hashchange', render);
  render();
  window.__APP_READY__ = true;   // 供 P4 生成式冒烟探针使用
})();

</script>
</body>
</html>
