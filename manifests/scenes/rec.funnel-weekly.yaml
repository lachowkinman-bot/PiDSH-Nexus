apiVersion: workbench.pi-dsh/v1
scene_id: rec.funnel-weekly@1.0.0
domain: REC
industry_overlay: null            # 首批 0 个；后续按 P1-4 只扩 1 个行业试点
required_capabilities:
  - cap.excel.panel
  - cap.approval.single
  - cap.redact.all
data_assets:
  - name: candidates.xlsx
    level: L3
    pii_fields: [candidate_phone, candidate_idcard]
  - name: interviews.xlsx
    level: L3
    pii_fields: []
skills: [funnel-analysis, jd-gen, interview-summary]
workflows: [workflows/rec.resume-forward.yaml, workflows/rec.funnel-report.yaml]
policies:
  permission:
    min_level: L3
    dual_approval: false
  redact:
    fields: [candidate_phone, candidate_idcard]
    gate: redact_gate
  memory:
    pii_allowed: false
    exclude: []
knowledge_seeds: [seeds/rec/README.md]
golden_tasks:
  - id: GT-REC-01
    input: "生成本周招聘漏斗周报（含瓶颈环节）"
    expected_plan: "见 docs/preset-design/rec.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L3"
    expected_output: reports/rec/gt-01.md
    expected_files: [data/rec/candidates.xlsx, data/rec/interviews.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-REC-02
    input: "按岗位需求生成 JD 并做合规检查"
    expected_plan: "见 docs/preset-design/rec.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L3"
    expected_output: reports/rec/gt-02.md
    expected_files: [data/rec/candidates.xlsx, data/rec/interviews.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-REC-03
    input: "把候选人简历脱敏后转发面试官（走审批）"
    expected_plan: "见 docs/preset-design/rec.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L3"
    expected_output: reports/rec/gt-03.md
    expected_files: [data/rec/candidates.xlsx, data/rec/interviews.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
# 特殊约束：候选人 PII 脱敏后再流转；demo 数据 6 行模板继承 002。
