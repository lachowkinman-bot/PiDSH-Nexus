apiVersion: workbench.pi-dsh/v1
scene_id: sales.quote-approval@1.0.0
domain: SALES
industry_overlay: null            # 首批 0 个；后续按 P1-4 只扩 1 个行业试点
required_capabilities:
  - cap.excel.panel
  - cap.approval.single
  - cap.redact.all
data_assets:
  - name: pipeline.xlsx
    level: L2
    pii_fields: []
  - name: contracts.xlsx
    level: L3
    pii_fields: [customer_contract]
skills: [quote-calc, win-review, quota-dashboard]
workflows: [workflows/sales.quote-approve.yaml, workflows/sales.win-review.yaml]
policies:
  permission:
    min_level: L3
    dual_approval: false
  redact:
    fields: [customer_contract, discount_floor]
    gate: redact_gate
  memory:
    pii_allowed: false
    exclude: []
knowledge_seeds: [seeds/sales/README.md]
golden_tasks:
