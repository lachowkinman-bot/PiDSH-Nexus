    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L3"
    expected_output: reports/sales/gt-01.md
    expected_files: [data/sales/pipeline.xlsx, data/sales/contracts.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-SALES-02
    input: "汇总本月赢单复盘要点"
