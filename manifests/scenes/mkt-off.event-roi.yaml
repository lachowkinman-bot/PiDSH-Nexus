apiVersion: workbench.pi-dsh/v1
scene_id: mkt-off.event-roi@1.0.0
domain: MKT
industry_overlay: null            # 首批 0 个；后续按 P1-4 只扩 1 个行业试点
required_capabilities:
  - cap.excel.panel
  - cap.approval.single
  - cap.redact.all
data_assets:
  - name: event-ledger.xlsx
    level: L2
    pii_fields: []
  - name: dealer-agreements.xlsx
    level: L3
    pii_fields: [dealer_terms]
skills: [event-plan, material-compliance, roi-review]
workflows: [workflows/mkt-off.material-review.yaml, workflows/mkt-off.roi-report.yaml]
policies:
  permission:
    min_level: L3
    dual_approval: false
  redact:
    fields: [dealer_terms]
    gate: redact_gate
  memory:
    pii_allowed: false
    exclude: []
knowledge_seeds: [seeds/mkt-off/README.md]
golden_tasks:
