    expected_permission: "L3"
    expected_output: reports/mkt-off/gt-02.md
    expected_files: [data/mkt-off/event-ledger.xlsx, data/mkt-off/dealer-agreements.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-MKTOFF-03
    input: "复盘上季度展会 ROI 并给出改善建议"
    expected_plan: "见 docs/preset-design/mkt-off.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L3"
    expected_output: reports/mkt-off/gt-03.md
    expected_files: [data/mkt-off/event-ledger.xlsx, data/mkt-off/dealer-agreements.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
