apiVersion: workbench.pi-dsh/v1
scene_id: mkt-on.content-publish@1.0.0
domain: MKT
industry_overlay: null            # 首批 0 个；后续按 P1-4 只扩 1 个行业试点
required_capabilities:
  - cap.excel.panel
  - cap.approval.single
  - cap.redact.all
data_assets:
  - name: content-calendar.xlsx
    level: L2
    pii_fields: []
  - name: leads-pipeline.xlsx
    level: L3
    pii_fields: [lead_phone]
skills: [content-gen, ad-analysis, seo-audit]
workflows: [workflows/mkt-on.publish-approve.yaml, workflows/mkt-on.campaign-report.yaml]
policies:
  permission:
    min_level: L4
    dual_approval: false
  redact:
    fields: [lead_phone, lead_idcard]
    gate: redact_gate
  memory:
    pii_allowed: false
    exclude: []
knowledge_seeds: [seeds/mkt-on/README.md]
golden_tasks:
  - id: GT-MKTON-01
    input: "生成本周内容日历草稿并提交发布审批"
    expected_plan: "见 docs/preset-design/mkt-on.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L4"
    expected_output: reports/mkt-on/gt-01.md
    expected_files: [data/mkt-on/content-calendar.xlsx, data/mkt-on/leads-pipeline.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-MKTON-02
    input: "分析上周投放数据并输出渠道 ROI 报告"
    expected_plan: "见 docs/preset-design/mkt-on.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L4"
    expected_output: reports/mkt-on/gt-02.md
    expected_files: [data/mkt-on/content-calendar.xlsx, data/mkt-on/leads-pipeline.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-MKTON-03
    input: "对落地页做 SEO 诊断并生成整改清单"
    expected_plan: "见 docs/preset-design/mkt-on.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L4"
    expected_output: reports/mkt-on/gt-03.md
    expected_files: [data/mkt-on/content-calendar.xlsx, data/mkt-on/leads-pipeline.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
