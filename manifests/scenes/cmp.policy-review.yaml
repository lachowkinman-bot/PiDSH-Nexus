apiVersion: workbench.pi-dsh/v1
scene_id: cmp.policy-review@1.0.0
domain: CMP
industry_overlay: null            # 首批 0 个；后续按 P1-4 只扩 1 个行业试点
required_capabilities:
  - cap.excel.panel
  - cap.approval.single
  - cap.redact.all
data_assets:
  - name: policies.xlsx
    level: L2
    pii_fields: []
  - name: audit-papers.xlsx
    level: L4
    pii_fields: [audit_working_papers]
skills: [policy-checklist, pipia-list, evidence-pack]
workflows: [workflows/cmp.evidence-pack.yaml, workflows/cmp.policy-report.yaml]
policies:
  permission:
    min_level: L4
    dual_approval: false
  redact:
    fields: [audit_working_papers]
    gate: redact_gate
  memory:
    pii_allowed: false
    exclude: []
knowledge_seeds: [seeds/cmp/README.md]
golden_tasks:
  - id: GT-CMP-01
    input: "对员工手册做合规 checklist 审查"
    expected_plan: "见 docs/preset-design/cmp.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L4"
    expected_output: reports/cmp/gt-01.md
    expected_files: [data/cmp/policies.xlsx, data/cmp/audit-papers.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-CMP-02
    input: "生成新业务上线 PIPIA 清单"
    expected_plan: "见 docs/preset-design/cmp.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L4"
    expected_output: reports/cmp/gt-02.md
    expected_files: [data/cmp/policies.xlsx, data/cmp/audit-papers.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
  - id: GT-CMP-03
    input: "打包某任务的完整证据链（审计级）"
    expected_plan: "见 docs/preset-design/cmp.md 任务分解"
    expected_tools: [cap.excel.panel, cap.approval.single]
    expected_permission: "L4"
    expected_output: reports/cmp/gt-03.md
    expected_files: [data/cmp/policies.xlsx, data/cmp/audit-papers.xlsx]
    expected_audit: "读/算/写审计事件"
    expected_quality: "结论可溯源到 sheet/row 级证据"
# 特殊约束：证据链五级：Requirement→Implementation→Test→Evidence→Release。
