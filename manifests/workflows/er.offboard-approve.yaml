apiVersion: workbench.pi-dsh/v1
workflow_id: er.offboard-approve@1.0.0
description: "离职流程多级审批"
trigger: { type: command, expr: "offboard-approve" }
nodes:
  - id: n1; type: skill; ref: offboarding-flow
  - id: n2; type: condition; expr: "处分/离职决定生效前"
  - id: n3; type: approval; level: L4; dual: true   # condition 的 then 分支禁止绕过审批直连外部写能力
  - id: n4; type: tool; ref: cap.excel.panel.write
  - id: n5; type: audit; record: "离职流程多级审批 + 审批人 + 依据数据版本"
check: { expected: "产物与审批单一致", actual_ref: audit/n5, on_fail: rollback }
hitl_nodes: [n3]
rollback: { method: savepoint, tag: pre-offboard-approve }
