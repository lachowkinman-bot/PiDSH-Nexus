apiVersion: workbench.pi-dsh/v1
workflow_id: mkt-off.material-review@1.0.0
domain: mkt-off
description: "物料合规审查（法务→品牌→归档）"
trigger:
  type: command
  expr: material-review
nodes:
  - id: n1
    type: skill
    ref: material-compliance
  - id: n2
    type: condition
    expr: "物料合规审查（法务→品牌→归档） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "物料合规审查（法务→品牌→归档）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: material-review-<ts>.json
  format: json
  fields:
    - material
    - legal_check
    - brand_check
    - final_status
  acceptance: "任一未过即不得外发；外发走审批"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-material-review
