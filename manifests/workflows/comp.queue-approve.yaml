apiVersion: workbench.pi-dsh/v1
workflow_id: comp.queue-approve@1.0.0
domain: comp
description: "调薪队列批量审批（HRD+CFO）"
trigger:
  type: command
  expr: queue-approve
nodes:
  - id: n1
    type: skill
    ref: compa-ratio
  - id: n2
    type: condition
    expr: "调薪队列批量审批（HRD+CFO） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "调薪队列批量审批（HRD+CFO）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: queue-approve-<ts>.json
  format: json
  fields:
    - batch
    - items
    - total_impact_wan
    - approvals
  acceptance: "批量影响 >50 万/年 加签 CEO"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-queue-approve
