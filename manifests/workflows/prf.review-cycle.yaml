apiVersion: workbench.pi-dsh/v1
workflow_id: prf.review-cycle@1.0.0
domain: prf
description: "考核周期发起（模板下发）"
trigger:
  type: command
  expr: review-cycle
nodes:
  - id: n1
    type: skill
    ref: kpi-track
  - id: n2
    type: tool
    ref: cap.excel.panel.write
  - id: n3
    type: audit
    record: "考核周期发起（模板下发）：输入参数 + 结果快照"
deliverable:
