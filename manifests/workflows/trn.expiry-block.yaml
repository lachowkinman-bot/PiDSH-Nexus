apiVersion: workbench.pi-dsh/v1
workflow_id: trn.expiry-block@1.0.0
description: "资质到期拦截"
trigger: { type: command, expr: "expiry-block" }
nodes:
  - id: n1; type: skill; ref: cert-expiry
  - id: n2; type: condition; expr: "资质过期人员不得排班上岗"
  - id: n3; type: approval; level: L3; dual: false   # condition 的 then 分支禁止绕过审批直连外部写能力
  - id: n4; type: tool; ref: cap.excel.panel.write
  - id: n5; type: audit; record: "资质到期拦截 + 审批人 + 依据数据版本"
check: { expected: "产物与审批单一致", actual_ref: audit/n5, on_fail: rollback }
hitl_nodes: [n3]
rollback: { method: savepoint, tag: pre-expiry-block }
