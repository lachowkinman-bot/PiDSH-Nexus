apiVersion: workbench.pi-dsh/v1
workflow_id: rec.interview-schedule@1.0.0
domain: rec
description: "面试安排、针对性题库与评分卡"
trigger:
  type: command
  expr: interview-schedule
nodes:
  - id: n1
    type: skill
    ref: interview-design
  - id: n2
    type: tool
    ref: cap.excel.panel.write
  - id: n3
    type: audit
    record: "面试安排、针对性题库与评分卡：输入参数 + 结果快照"
deliverable:
  file: interview-schedule-<ts>.json
  format: json
  fields:
    - candidate_masked
    - slot
    - interviewers
    - mode
    - question_bank_id
    - scorecard_id
    - conflicts
  acceptance: "面试官冲突须标红；题库覆盖全部能力项"
hitl_nodes:
rollback:
  method: savepoint
  tag: pre-interview-schedule
