apiVersion: workbench.pi-dsh/v1
workflow_id: rec.offer-approve@1.0.0
domain: rec
description: "offer 审批（薪酬带核对）"
trigger:
  type: command
  expr: offer-approve
nodes:
  - id: n1
    type: skill
    ref: funnel-analysis
  - id: n2
    type: condition
    expr: "offer 审批（薪酬带核对） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "offer 审批（薪酬带核对）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: offer-approve-<ts>.json
  format: json
  fields:
    - candidate_masked
    - position
    - offer_band
    - approvals
  acceptance: "offer 超出 P75 必须双审批"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-offer-approve
