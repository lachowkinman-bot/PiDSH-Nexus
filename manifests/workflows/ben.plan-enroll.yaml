apiVersion: workbench.pi-dsh/v1
workflow_id: ben.plan-enroll@1.0.0
domain: ben
description: "方案投保/变更审批"
trigger:
  type: command
  expr: plan-enroll
nodes:
  - id: n1
    type: skill
    ref: plan-compare
  - id: n2
    type: condition
    expr: "方案投保/变更审批 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "方案投保/变更审批：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: plan-enroll-<ts>.json
  format: json
  fields:
    - employee_masked
    - plan
    - effective_date
    - approver
  acceptance: "家属信息仅掩码"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-plan-enroll
