apiVersion: workbench.pi-dsh/v1
workflow_id: er-eap.eap-referral@1.0.0
domain: er-eap
description: "EAP 转介（双审批 + 匿名化）"
trigger:
  type: command
  expr: eap-referral
nodes:
  - id: n1
    type: skill
    ref: eap-referral
  - id: n2
    type: condition
    expr: "EAP 转介（双审批 + 匿名化） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "EAP 转介（双审批 + 匿名化）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: eap-referral-<ts>.json
  format: json
  fields:
    - anon_id
    - direction
    - approvals
    - sessions
  acceptance: "输出仅匿名编号；禁网；禁入记忆层"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-eap-referral
