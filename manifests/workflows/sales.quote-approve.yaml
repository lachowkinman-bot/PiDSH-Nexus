apiVersion: workbench.pi-dsh/v1
workflow_id: sales.quote-approve@1.0.0
domain: sales
description: "报价审批（DAG + 折扣阈值）"
trigger:
  type: command
  expr: quote-approve
nodes:
  - id: n1
    type: skill
    ref: quote-calc
  - id: n2
    type: condition
    expr: "报价审批（DAG + 折扣阈值） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "报价审批（DAG + 折扣阈值）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: quote-approve-<ts>.json
  format: json
  fields:
    - quote_id
    - total_wan
    - discount_pct
    - approvals
  acceptance: "折扣 ≥10% 双审批；≥15% 加签 CFO"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-quote-approve
