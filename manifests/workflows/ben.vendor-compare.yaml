apiVersion: workbench.pi-dsh/v1
workflow_id: ben.vendor-compare@1.0.0
domain: ben
description: "方案比选（DAG：商保/体检/弹性）"
trigger:
  type: command
  expr: vendor-compare
nodes:
  - id: n1
    type: skill
    ref: plan-compare
  - id: n2
    type: condition
    expr: "方案比选（DAG：商保/体检/弹性） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "方案比选（DAG：商保/体检/弹性）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: vendor-compare-<ts>.json
  format: json
  fields:
    - category
    - vendors
    - points
    - winner
  acceptance: "健康数据 L4 禁入记忆层"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-vendor-compare
