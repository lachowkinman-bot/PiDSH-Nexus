apiVersion: workbench.pi-dsh/v1
workflow_id: strat.quarter-close@1.0.0
domain: strat
description: "季度关账经营决议（含调薪包）"
trigger:
  type: command
  expr: quarter-close
nodes:
  - id: n1
    type: skill
    ref: strategy-decode
  - id: n2
    type: condition
    expr: "季度关账经营决议（含调薪包） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "季度关账经营决议（含调薪包）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: quarter-close-<ts>.json
  format: json
  fields:
    - period
    - highlights
    - comp_package_flag
    - approvals
  acceptance: "调薪包触发 COMP 域双审批联动"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-quarter-close
