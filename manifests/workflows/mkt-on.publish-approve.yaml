apiVersion: workbench.pi-dsh/v1
workflow_id: mkt-on.publish-approve@1.0.0
domain: mkt-on
description: "内容发布审批（L4 强审批 + 脱敏）"
trigger:
  type: command
  expr: publish-approve
nodes:
  - id: n1
    type: skill
    ref: content-gen
  - id: n2
    type: condition
    expr: "内容发布审批（L4 强审批 + 脱敏） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "内容发布审批（L4 强审批 + 脱敏）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: publish-approve-<ts>.json
  format: json
  fields:
    - title
    - channel
    - publish_at
    - pii_check
    - approver
  acceptance: "含 PII 的素材必须 redact 后才可发布"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-publish-approve
