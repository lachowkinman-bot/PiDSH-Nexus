apiVersion: workbench.pi-dsh/v1
workflow_id: prf.calibration-approve@1.0.0
domain: prf
description: "绩效校准（双审批）"
trigger:
  type: command
  expr: calibration-approve
nodes:
  - id: n1
    type: skill
    ref: calibration-analysis
  - id: n2
    type: condition
    expr: "绩效校准（双审批） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "绩效校准（双审批）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: calibration-approve-<ts>.json
  format: json
  fields:
    - employee_masked
    - manager_grade
    - calibrated_grade
    - approvals
  acceptance: "校准纪要禁入记忆层"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-calibration-approve
