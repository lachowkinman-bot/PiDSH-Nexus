apiVersion: workbench.pi-dsh/v1
workflow_id: mkt-on.ad-spend-review@1.0.0
domain: mkt-on
description: "投放加预算审批（阈值触发）"
trigger:
  type: command
  expr: ad-spend-review
nodes:
  - id: n1
    type: skill
    ref: ad-analysis
  - id: n2
    type: condition
    expr: "投放加预算审批（阈值触发） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "投放加预算审批（阈值触发）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: ad-spend-review-<ts>.json
  format: json
  fields:
    - channel
    - current_spend_wan
    - increment_wan
    - expected_roi
  acceptance: "单周加预算 >10 万触发双审批"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-ad-spend-review
