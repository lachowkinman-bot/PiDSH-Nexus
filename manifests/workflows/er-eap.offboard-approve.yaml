apiVersion: workbench.pi-dsh/v1
workflow_id: er-eap.offboard-approve@1.0.0
domain: er-eap
description: "离职流程（多级审批）"
trigger:
  type: command
  expr: offboard-approve
nodes:
  - id: n1
    type: skill
    ref: offboarding-flow
  - id: n2
    type: condition
    expr: "离职流程（多级审批） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "离职流程（多级审批）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: offboard-approve-<ts>.json
  format: json
  fields:
    - employee_masked
    - last_day
    - handover_ok
    - approvals
  acceptance: "交接未完成不得进入最后一步"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-offboard-approve
