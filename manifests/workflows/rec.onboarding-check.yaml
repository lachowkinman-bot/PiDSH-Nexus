apiVersion: workbench.pi-dsh/v1
workflow_id: rec.onboarding-check@1.0.0
domain: rec
description: "入职任务、30/60/90 天成效与招聘质量"
trigger:
  type: command
  expr: onboarding-check
nodes:
  - id: n1
    type: skill
    ref: onboarding-plan
  - id: n2
    type: tool
    ref: cap.excel.panel.write
  - id: n3
    type: audit
    record: "入职任务、30/60/90 天成效与招聘质量：数据版本 + 产物哈希"
deliverable:
  file: onboarding-check-<ts>.json
  format: json
  fields:
    - candidate_masked
    - start_date
    - item
    - owner
    - due
    - status
    - goals_30_60_90
    - retention_90d
  acceptance: "阻断项完成；未到 90 天不得伪造留存结果"
hitl_nodes:
rollback:
  method: savepoint
  tag: pre-onboarding-check
