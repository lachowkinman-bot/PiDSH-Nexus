apiVersion: workbench.pi-dsh/v1
workflow_id: sales.contract-review@1.0.0
domain: sales
description: "合同评审（法务/财务会签）"
trigger:
  type: command
  expr: contract-review
nodes:
  - id: n1
    type: skill
    ref: win-review
  - id: n2
    type: condition
    expr: "合同评审（法务/财务会签） 触发对外/生效动作"
  - id: n3
    type: approval
    level: L4
    dual: true
  - id: n4
    type: tool
    ref: cap.excel.panel.write
  - id: n5
    type: audit
    record: "合同评审（法务/财务会签）：审批人 + 依据数据版本 + 产物哈希"
deliverable:
  file: contract-review-<ts>.json
  format: json
  fields:
    - contract_no
    - terms_risk
    - payment_terms
    - approvals
  acceptance: "回款条款偏离标准必须双审批"
hitl_nodes:
  - n3
rollback:
  method: savepoint
  tag: pre-contract-review
